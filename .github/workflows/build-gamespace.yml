name: Build Game Space APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q GameSpace.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: GameSpace
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GameSpace-apk
          path: GameSpace/app/build/outputs/apk/release/*.apk
